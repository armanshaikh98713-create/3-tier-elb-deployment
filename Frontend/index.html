<!DOCTYPE html>
<html>
<head>
    <title>My S3 Website</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="margin:0; font-family:Arial; background:linear-gradient(135deg,#667eea,#764ba2); color:white; text-align:center;">

    <!-- HEADER -->
    <div style="padding:60px 20px;">
        <h1 style="font-size:50px; margin-bottom:10px;">Welcome 🚀</h1>
        <p style="font-size:18px; opacity:0.9;">My Website Hosted on AWS S3</p>

        <button onclick="showMsg()" 
            style="margin-top:20px; padding:12px 25px; border:none; border-radius:25px; background:white; color:#764ba2; font-size:16px; cursor:pointer;">
            Click Me
        </button>
    </div>

    <!-- FEATURES -->
    <div style="display:flex; justify-content:center; flex-wrap:wrap; padding:30px;">

        <div style="background:white; color:#333; width:250px; margin:15px; padding:20px; border-radius:12px;">
            <h3>⚡ Fast</h3>
            <p>Served from AWS cloud infrastructure.</p>
        </div>

        <div style="background:white; color:#333; width:250px; margin:15px; padding:20px; border-radius:12px;">
            <h3>🌍 Global</h3>
            <p>Accessible from anywhere in the world.</p>
        </div>

        <div style="background:white; color:#333; width:250px; margin:15px; padding:20px; border-radius:12px;">
            <h3>🔒 Secure</h3>
            <p>Reliable and scalable hosting.</p>
        </div>

    </div>

    <!-- FOOTER -->
    <div style="padding:20px; background:rgba(0,0,0,0.2);">
        <p>© 2026 My S3 Website</p>
    </div>

    <script>
        function showMsg(){
            alert("Your S3 website is live 🎉");
        }
    </script>

</body>
</html>
